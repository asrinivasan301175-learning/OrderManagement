apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ordermanagement-ingress
  namespace: ordermanagement

spec:
  ingressClassName: nginx

  rules:
    - host: orders.example.com

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: ordermanagement-service
                port:
                  number: 80
